<?xml version="1.0" encoding="UTF-8"?>
<!--
  tail -f app icon — original mark.
  Concept: a terminal-style prompt caret "›" — the cue to "follow the source".
  Single accent glyph on a dark tile. Drawn on a 512x512 canvas.
  Safe for "any" usage (full-bleed tile).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="tail -f">
  <defs>
    <linearGradient id="tf-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf6c9"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <!-- dark tile -->
  <rect width="512" height="512" rx="112" fill="#0b0f14"/>
  <!-- subtle inner frame for depth -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#11181f" stroke-width="6"/>
  <!-- the prompt caret "›" -->
  <path d="M180 136 L344 256 L180 376"
        fill="none" stroke="url(#tf-accent)" stroke-width="52"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
