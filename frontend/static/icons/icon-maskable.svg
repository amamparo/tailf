<?xml version="1.0" encoding="UTF-8"?>
<!--
  Maskable variant of the tail -f mark.
  The same prompt caret scaled into the central ~80% safe zone (per the maskable
  spec, the outer ~10% on each edge may be clipped by the platform mask).
  Full-bleed accent-on-dark.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="tail -f">
  <defs>
    <linearGradient id="tf-accent-m" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf6c9"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <!-- full-bleed dark tile (no rounded corners; the platform mask provides shape) -->
  <rect width="512" height="512" fill="#0b0f14"/>
  <!-- prompt caret scaled to the safe zone -->
  <path d="M196 168 L320 256 L196 344"
        fill="none" stroke="url(#tf-accent-m)" stroke-width="42"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
